<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Agent 面板 · 单机 Agent 运行实况</title>
<style>
  /* ================= 设计变量 ================= */
  :root{
    /* 暗色层次（由深到浅，营造纵深） */
    --bg-0:#080a0f; --bg-1:#0d1017; --bg-2:#131820; --bg-3:#1a212c; --bg-4:#222b38;
    /* 边框：常态 / 悬停 / 高亮 */
    --bd:#212936; --bd-hi:#2e3a4b; --bd-ac:#2f6b46;
    /* 文本阶梯 */
    --fg:#e9eef6; --fg-2:#a3b0c2; --fg-3:#71809a; --fg-4:#4d5a6e;
    /* 品牌与语义色 */
    --ac:#3ddc84; --ac-2:#22b467; --ac-dim:rgba(61,220,132,.14); --ac-glow:rgba(61,220,132,.35);
    --warn:#f0b429; --err:#ff6b6b; --info:#5aa9ff; --think:#93a3bd; --violet:#a78bfa;
    --mono:'JetBrains Mono','Cascadia Code','Consolas','SF Mono',monospace;
    --radius:10px; --radius-lg:14px;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 4px 16px rgba(0,0,0,.35);
    --shadow-glow:0 0 24px -6px var(--ac-glow);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  ::selection{background:var(--ac-dim);color:var(--ac)}
  html,body{height:100%}
  body{
    background:radial-gradient(1200px 600px at 75% -10%, rgba(34,180,103,.07), transparent 60%),
               radial-gradient(900px 500px at -10% 100%, rgba(90,169,255,.05), transparent 55%),
               var(--bg-1);
    color:var(--fg);
    font:400 13px/1.55 -apple-system,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
    display:flex;flex-direction:column;overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }

  /* ================= 顶栏（毛玻璃 + 微光底线） ================= */
  header{
    height:54px;display:flex;align-items:center;gap:12px;padding:0 18px;
    background:rgba(13,16,23,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border-bottom:1px solid var(--bd);
    position:relative;z-index:10;flex-shrink:0;
  }
  header::after{content:'';position:absolute;left:0;right:0;bottom:-1px;height:1px;
    background:linear-gradient(90deg,transparent,rgba(61,220,132,.25),transparent)}
  .logo{
    width:28px;height:28px;border-radius:8px;position:relative;
    background:linear-gradient(145deg,#2ee57f,#159a52);
    box-shadow:0 0 0 1px rgba(255,255,255,.08) inset, 0 2px 10px -2px var(--ac-glow);
    display:flex;align-items:center;justify-content:center;font-size:14px;
  }
  .logo::after{content:'';position:absolute;inset:0;border-radius:8px;
    background:linear-gradient(180deg,rgba(255,255,255,.22),transparent 45%);pointer-events:none}
  header h1{font-size:14px;font-weight:650;letter-spacing:.2px}
  header .sub{color:var(--fg-4);font-weight:400;font-size:12px;margin-left:2px}
  header .conn{
    margin-left:auto;display:flex;align-items:center;gap:7px;font-size:12px;color:var(--fg-2);
    background:var(--bg-2);border:1px solid var(--bd);border-radius:999px;padding:5px 12px;
  }
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ac);position:relative;flex-shrink:0}
  .dot::after{content:'';position:absolute;inset:-4px;border-radius:50%;
    background:var(--ac-glow);animation:ring 2.2s ease-out infinite}
  .dot.off{background:var(--err)}
  .dot.off::after{background:rgba(255,107,107,.35);animation:none}
  .dot.busy{background:var(--warn)}
  .dot.busy::after{background:rgba(240,180,41,.35)}
  @keyframes ring{0%{transform:scale(.5);opacity:.9}70%{transform:scale(1.6);opacity:0}100%{opacity:0}}

  .layout{flex:1;display:flex;overflow:hidden}

  /* ================= 左栏 ================= */
  .sidebar{width:238px;flex-shrink:0;display:flex;flex-direction:column;
    background:var(--bg-0);border-right:1px solid var(--bd)}
  .sidebar .head{padding:12px 14px 10px;display:flex;justify-content:space-between;align-items:center}
  .sidebar .head .t{font-size:11px;font-weight:650;letter-spacing:.8px;text-transform:uppercase;color:var(--fg-4)}
  .btn-new{
    display:flex;align-items:center;gap:5px;background:var(--ac-dim);color:var(--ac);
    border:1px solid rgba(61,220,132,.25);border-radius:8px;padding:5px 11px;
    font-size:12px;font-weight:600;cursor:pointer;transition:.16s;
  }
  .btn-new:hover{background:rgba(61,220,132,.2);border-color:rgba(61,220,132,.45);box-shadow:var(--shadow-glow)}
  .runlist{flex:1;overflow-y:auto;padding:4px 8px 12px}
  .runitem{position:relative;padding:9px 10px 9px 16px;border-radius:var(--radius);cursor:pointer;
    margin-bottom:3px;border:1px solid transparent;transition:.16s}
  .runitem::before{content:'';position:absolute;left:6px;top:12px;bottom:12px;width:2px;border-radius:2px;
    background:var(--bd-hi);transition:.16s}
  .runitem:hover{background:var(--bg-2)}
  .runitem.active{background:var(--bg-2);border-color:var(--bd-hi);box-shadow:var(--shadow-1)}
  .runitem.active::before{background:linear-gradient(180deg,var(--ac),var(--ac-2));box-shadow:0 0 8px var(--ac-glow)}
  .runitem .id{display:flex;align-items:center;gap:6px}
  .runitem .meta{font-size:11px;color:var(--fg-4);margin-top:4px;display:flex;gap:6px;align-items:center}
  .runitem .pv{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;color:var(--fg-3)}
  .badge{padding:1.5px 7px;border-radius:999px;font-size:10px;font-weight:650;letter-spacing:.2px;
    border:1px solid transparent;flex-shrink:0}
  .st-running{background:rgba(240,180,41,.12);color:var(--warn);border-color:rgba(240,180,41,.25)}
  .st-completed{background:var(--ac-dim);color:var(--ac);border-color:rgba(61,220,132,.25)}
  .st-failed,.st-interrupted{background:rgba(255,107,107,.12);color:var(--err);border-color:rgba(255,107,107,.25)}
  .sidebar .foot{padding:10px 14px;border-top:1px solid var(--bd);font-size:11px;color:var(--fg-4)}

  /* ================= 中栏 ================= */
  .main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
  .runbar{
    display:none;align-items:center;gap:10px;padding:9px 18px;flex-shrink:0;
    background:linear-gradient(180deg,var(--bg-2),var(--bg-1));border-bottom:1px solid var(--bd);
    font-size:12px;color:var(--fg-2);
  }
  .runbar.show{display:flex}
  .runbar .rid{font:600 11.5px var(--mono);color:var(--fg)}
  .btn-abort{
    margin-left:auto;background:rgba(255,107,107,.1);color:var(--err);
    border:1px solid rgba(255,107,107,.3);border-radius:7px;padding:4px 12px;
    font-size:11.5px;font-weight:600;cursor:pointer;transition:.16s;
  }
  .btn-abort:hover{background:rgba(255,107,107,.2);box-shadow:0 0 16px -4px rgba(255,107,107,.5)}

  .composer{padding:14px 18px 12px;flex-shrink:0;background:linear-gradient(180deg,var(--bg-1),transparent)}
  .composer .card{
    background:var(--bg-2);border:1px solid var(--bd);border-radius:var(--radius-lg);
    box-shadow:var(--shadow-2);transition:.2s;overflow:hidden;
  }
  .composer .card:focus-within{border-color:var(--bd-ac);box-shadow:var(--shadow-2),var(--shadow-glow)}
  .composer textarea{
    width:100%;background:transparent;border:none;color:var(--fg);padding:12px 14px 4px;
    font:400 13.5px/1.6 inherit;resize:none;min-height:64px;outline:none;
  }
  .composer textarea::placeholder{color:var(--fg-4)}
  .composer .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:8px 12px 11px;
    border-top:1px solid var(--bd)}
  .field{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--fg-3)}
  .field input[type=text]{width:118px;background:var(--bg-1);border:1px solid var(--bd);border-radius:7px;
    color:var(--fg);padding:5px 9px;font:500 12px var(--mono);outline:none;transition:.15s}
  .field input[type=text]:focus{border-color:var(--bd-ac)}
  .switch{display:flex;align-items:center;gap:7px;cursor:pointer;user-select:none;font-size:12px;color:var(--fg-3)}
  .switch input{display:none}
  .switch .track{width:32px;height:18px;border-radius:999px;background:var(--bg-4);
    border:1px solid var(--bd-hi);position:relative;transition:.2s;flex-shrink:0}
  .switch .track::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;
    background:var(--fg-3);transition:.2s}
  .switch input:checked + .track{background:var(--ac-dim);border-color:rgba(61,220,132,.4)}
  .switch input:checked + .track::after{left:16px;background:var(--ac);box-shadow:0 0 8px var(--ac-glow)}
  .btn-primary{
    margin-left:auto;display:flex;align-items:center;gap:7px;
    background:linear-gradient(180deg,#37d67d,#1fa35c);color:#04150c;
    border:none;border-radius:9px;padding:8px 20px;font-size:13px;font-weight:700;letter-spacing:.2px;
    cursor:pointer;transition:.16s;position:relative;
    box-shadow:0 1px 0 rgba(255,255,255,.25) inset, 0 3px 12px -3px var(--ac-glow);
  }
  .btn-primary:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 1px 0 rgba(255,255,255,.3) inset,0 6px 20px -4px var(--ac-glow)}
  .btn-primary:active:not(:disabled){transform:translateY(0)}
  .btn-primary:disabled{opacity:.45;cursor:not-allowed;filter:saturate(.5)}

  .stream{flex:1;overflow-y:auto;padding:6px 18px 24px}

  /* ================= 事件块 ================= */
  .ev{margin-bottom:9px;animation:evIn .22s cubic-bezier(.2,.7,.3,1)}
  @keyframes evIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

  /* 思考块 */
  .ev-think{position:relative;background:linear-gradient(90deg,rgba(147,163,189,.05),transparent 65%);
    border-radius:8px;padding:8px 12px 8px 16px;overflow:hidden}
  .ev-think::before{content:'';position:absolute;left:0;top:6px;bottom:6px;width:2px;border-radius:2px;
    background:linear-gradient(180deg,var(--think),transparent)}
  .ev-think .label{font-size:10.5px;font-weight:650;letter-spacing:.6px;color:var(--fg-4);
    display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;margin-bottom:3px}
  .ev-think .label .cnt{color:var(--fg-4);opacity:.7;font-weight:400}
  .ev-think .label .chev{transition:.18s;display:inline-block;font-size:9px}
  .ev-think.collapsed .chev{transform:rotate(-90deg)}
  .ev-think .tcontent{color:var(--think);font-size:12.5px;line-height:1.65;white-space:pre-wrap;
    font-style:italic;opacity:.92}
  .ev-think.collapsed .tcontent{display:none}

  /* 正文 */
  .ev-text{color:var(--fg);font-size:13.5px;line-height:1.72;white-space:pre-wrap;padding:1px 2px}

  /* 工具卡 */
  .ev-tool{background:var(--bg-2);border:1px solid var(--bd);border-radius:var(--radius);
    transition:.16s;overflow:hidden}
  .ev-tool:hover{border-color:var(--bd-hi)}
  .ev-tool .thead{display:flex;align-items:center;gap:9px;padding:9px 12px;cursor:pointer;user-select:none}
  .chip{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    font-size:13px;flex-shrink:0;border:1px solid transparent}
  .chip.shell{background:rgba(240,180,41,.1);border-color:rgba(240,180,41,.22)}
  .chip.edit{background:rgba(61,220,132,.1);border-color:rgba(61,220,132,.22)}
  .chip.read{background:rgba(90,169,255,.1);border-color:rgba(90,169,255,.22)}
  .chip.agent{background:rgba(167,139,250,.1);border-color:rgba(167,139,250,.22)}
  .chip.mcp{background:rgba(240,180,41,.08);border-color:rgba(240,180,41,.2)}
  .chip.web{background:rgba(90,169,255,.08);border-color:rgba(90,169,255,.2)}
  .ev-tool .tname{font:650 12.5px var(--mono);color:var(--fg);flex-shrink:0}
  .ev-tool .tsum{font:400 12px var(--mono);color:var(--fg-3);overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap;flex:1;min-width:0}
  .ev-tool .chev{margin-left:auto;color:var(--fg-4);font-size:10px;transition:.2s;flex-shrink:0}
  .ev-tool.open .chev{transform:rotate(180deg)}
  .ev-tool .tbody{display:none;border-top:1px solid var(--bd)}
  .ev-tool.open .tbody{display:block;animation:evIn .18s}
  .ev-tool .sect{padding:9px 12px}
  .ev-tool .sect + .sect{border-top:1px dashed var(--bd)}
  .ev-tool .stitle{font-size:10px;font-weight:650;letter-spacing:.6px;text-transform:uppercase;
    color:var(--fg-4);margin-bottom:5px}
  .ev-tool pre{font:400 11.5px/1.6 var(--mono);color:var(--fg-2);white-space:pre-wrap;word-break:break-all;
    background:var(--bg-0);border:1px solid var(--bd);border-radius:7px;padding:8px 10px;
    max-height:220px;overflow:auto}
  .ev-tool pre.err{color:var(--err);border-color:rgba(255,107,107,.3);background:rgba(255,107,107,.05)}

  /* 计划卡 */
  .ev-plan{background:var(--bg-2);border:1px solid var(--bd);border-radius:var(--radius);padding:12px 14px}
  .ev-plan .ptop{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .ev-plan .ptitle{font-size:11px;font-weight:650;letter-spacing:.6px;text-transform:uppercase;color:var(--fg-4)}
  .ev-plan .pprog{margin-left:auto;font:600 11px var(--mono);color:var(--fg-3)}
  .pbar{height:3px;border-radius:2px;background:var(--bg-4);overflow:hidden;margin-bottom:10px}
  .pbar i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,var(--ac-2),var(--ac));
    transition:width .4s cubic-bezier(.3,.7,.3,1);box-shadow:0 0 8px var(--ac-glow)}
  .ev-plan .pstep{display:flex;align-items:flex-start;gap:9px;padding:3.5px 0;font-size:12.5px;color:var(--fg-3);transition:.2s}
  .ev-plan .pstep .ic{width:17px;height:17px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;
    justify-content:center;font-size:9px;border:1.5px solid var(--bd-hi);color:var(--fg-4);margin-top:1px}
  .ev-plan .pstep.done{color:var(--fg-2)}
  .ev-plan .pstep.done .ic{background:var(--ac-dim);border-color:var(--ac);color:var(--ac)}
  .ev-plan .pstep.in_progress{color:var(--warn)}
  .ev-plan .pstep.in_progress .ic{border-color:var(--warn);color:var(--warn)}
  .ev-plan .pstep.failed{color:var(--err)}
  .ev-plan .pstep.failed .ic{border-color:var(--err);color:var(--err)}

  /* 结果卡 */
  .ev-result{position:relative;border-radius:var(--radius-lg);padding:14px 16px;overflow:hidden;
    background:linear-gradient(160deg,rgba(61,220,132,.09),var(--bg-2) 55%);
    border:1px solid rgba(61,220,132,.28);box-shadow:0 0 30px -12px var(--ac-glow)}
  .ev-result.err{background:linear-gradient(160deg,rgba(255,107,107,.09),var(--bg-2) 55%);
    border-color:rgba(255,107,107,.3);box-shadow:0 0 30px -12px rgba(255,107,107,.4)}
  .ev-result .rhead{display:flex;align-items:center;gap:9px;margin-bottom:10px;flex-wrap:wrap}
  .ev-result .rtitle{font-size:13px;font-weight:700;color:var(--ac)}
  .ev-result.err .rtitle{color:var(--err)}
  .ev-result .rpills{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
  .pill{display:flex;align-items:baseline;gap:4px;background:rgba(0,0,0,.25);border:1px solid var(--bd);
    border-radius:7px;padding:3px 9px}
  .pill .k{font-size:9.5px;color:var(--fg-4);text-transform:uppercase;letter-spacing:.4px}
  .pill .v{font:700 12px var(--mono);color:var(--fg)}
  .ev-result .rout{white-space:pre-wrap;font-size:12.5px;line-height:1.7;color:var(--fg-2);
    background:rgba(0,0,0,.22);border:1px solid var(--bd);border-radius:9px;padding:10px 12px;
    max-height:280px;overflow:auto}

  /* 错误条 */
  .ev-err{display:flex;gap:9px;background:rgba(255,107,107,.07);border:1px solid rgba(255,107,107,.28);
    border-left:3px solid var(--err);border-radius:8px;padding:10px 13px;color:#ffb3b3;
    font-size:12.5px;white-space:pre-wrap;line-height:1.6}

  /* 回放徽标 */
  .replay-badge{display:inline-flex;align-items:center;gap:7px;background:rgba(240,180,41,.1);
    color:var(--warn);border:1px solid rgba(240,180,41,.3);border-radius:999px;
    padding:4px 13px;font-size:11.5px;font-weight:650;margin-bottom:10px}

  /* ================= 右栏 ================= */
  .rightbar{width:294px;flex-shrink:0;background:var(--bg-0);border-left:1px solid var(--bd);
    overflow-y:auto;padding:14px}
  .sec{margin-bottom:18px}
  .sec > h3{font-size:10.5px;font-weight:650;letter-spacing:.8px;text-transform:uppercase;
    color:var(--fg-4);margin-bottom:9px;display:flex;align-items:center;gap:7px}
  .sec > h3::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--bd),transparent)}
  .statgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
  .cell{background:var(--bg-2);border:1px solid var(--bd);border-radius:var(--radius);padding:10px 8px;
    text-align:center;transition:.16s}
  .cell:hover{border-color:var(--bd-hi)}
  .cell .v{font:700 16px/1.2 var(--mono);color:var(--fg);letter-spacing:-.3px}
  .cell .v.sm{font-size:13px}
  .cell .k{font-size:9.5px;color:var(--fg-4);margin-top:3px;text-transform:uppercase;letter-spacing:.5px}
  .cell.hl .v{color:var(--ac)}
  .artbox{display:flex;flex-direction:column;gap:6px}
  .btn-art{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;
    background:var(--bg-2);border:1px solid var(--bd);border-radius:8px;color:var(--fg-2);
    padding:7px 10px;font-size:11.5px;font-weight:600;cursor:pointer;transition:.16s;font-family:var(--mono)}
  .btn-art:hover{border-color:var(--bd-ac);color:var(--ac);background:var(--ac-dim)}
  .preview-frame{width:100%;height:380px;border:1px solid var(--bd-hi);border-radius:var(--radius);
    background:#fff;margin-top:7px;display:none}
  .tracebox{font:400 11px/1.6 var(--mono);color:var(--fg-3);background:var(--bg-2);
    border:1px solid var(--bd);border-radius:var(--radius);padding:10px;white-space:pre-wrap;
    word-break:break-all;max-height:300px;overflow:auto}

  /* 空态 */
  .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
    padding:60px 24px;color:var(--fg-4);text-align:center;font-size:12.5px;line-height:1.9}
  .empty .glyph{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center;
    font-size:22px;background:var(--bg-2);border:1px solid var(--bd);box-shadow:var(--shadow-2)}
  .empty kbd{background:var(--bg-3);border:1px solid var(--bd-hi);border-bottom-width:2px;
    border-radius:5px;padding:1px 6px;font:600 10.5px var(--mono);color:var(--fg-3)}

  /* 滚动条 */
  ::-webkit-scrollbar{width:9px;height:9px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--bg-4);border-radius:6px;border:2px solid var(--bg-0)}
  ::-webkit-scrollbar-thumb:hover{background:var(--bd-hi)}
</style>
</head>
<body>
<header>
  <div class="logo">⚡</div>
  <h1>Agent 面板 <span class="sub">· 单机 Agent 运行实况</span></h1>
  <div class="conn"><span class="dot" id="conn-dot"></span><span id="conn-text">就绪</span></div>
</header>
<div class="layout">
  <aside class="sidebar">
    <div class="head">
      <span class="t">运行历史</span>
      <button class="btn-new" onclick="newTask()">＋ 新任务</button>
    </div>
    <div class="runlist" id="runlist"><div class="empty"><div class="glyph">📡</div>加载中…</div></div>
    <div class="foot" id="sidebar-foot">—</div>
  </aside>
  <main class="main">
    <div class="runbar" id="runbar">
      <span class="dot busy"></span>
      <span class="rid" id="runbar-id">—</span>
      <span id="runbar-state">执行中…</span>
      <button class="btn-abort" onclick="abortRun()">中断</button>
    </div>
    <div class="composer" id="composer">
      <div class="card">
        <textarea id="prompt" placeholder="给 Agent 下发任务…（Ctrl + Enter 派发）"></textarea>
        <div class="row">
          <label class="field">model
            <input type="text" id="model" placeholder="默认"/>
          </label>
          <label class="switch" title="分步执行并实时勾选计划步骤">
            <input type="checkbox" id="plan-cb"/><span class="track"></span>规划引擎
          </label>
          <button class="btn-primary" id="btn-dispatch" onclick="dispatch()">派发 ▸</button>
        </div>
      </div>
    </div>
    <div class="stream" id="stream">
      <div class="empty">
        <div class="glyph">🛰️</div>
        <div>输入任务后点击 <kbd>派发</kbd>，或点击左栏历史运行回放。<br/>
        事件流将实时展示：<b style="color:var(--think)">思考过程</b> ·
        <b style="color:var(--warn)">执行的命令</b> ·
        <b style="color:var(--info)">工具 / skill / MCP 调用</b> ·
        <b style="color:var(--ac)">计划步骤</b> · 最终结果</div>
      </div>
    </div>
  </main>
  <aside class="rightbar" id="rightbar">
    <div class="empty"><div class="glyph">📊</div>运行开始后显示<br/>用量统计 · 产物预览 · trace</div>
  </aside>
</div>

<script>
const $ = id => document.getElementById(id);
let currentRunId = null, live = false, lastSeq = 0, abortCtl = null, planSteps = null;

function setConn(state, text){
  const d = $('conn-dot');
  d.className = 'dot' + (state === 'ok' ? '' : state === 'busy' ? ' busy' : ' off');
  $('conn-text').textContent = text;
}
function esc(s){ return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function el(html){ const t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstElementChild; }
function streamEl(){ return $('stream'); }
function scrollBottom(){ const s = streamEl(); s.scrollTop = s.scrollHeight; }

/* ================= 运行状态条 ================= */
function showRunbar(rid, state){
  $('runbar').classList.add('show');
  $('runbar-id').textContent = rid || '—';
  $('runbar-state').textContent = state || '执行中…';
}
function hideRunbar(){ $('runbar').classList.remove('show'); }

/* ================= 任务输入 / 派发 ================= */
function newTask(){
  abortRun(true);
  currentRunId = null; lastSeq = 0; planSteps = null;
  hideRunbar();
  $('prompt').value = ''; $('prompt').focus();
  streamEl().innerHTML =
    '<div class="empty"><div class="glyph">🛰️</div>' +
    '<div>输入任务后点击 <kbd>派发</kbd>，或点击左栏历史运行回放。</div></div>';
  renderRight(null);
  document.querySelectorAll('.runitem').forEach(n => n.classList.remove('active'));
}

function dispatch(){
  const prompt = $('prompt').value.trim();
  if(!prompt) return;
  const model = $('model').value.trim();
  const planning = $('plan-cb').checked;
  planSteps = null; lastSeq = 0; currentRunId = null; live = true;
  streamEl().innerHTML = '';
  $('btn-dispatch').disabled = true; $('btn-dispatch').textContent = '执行中…';
  setConn('busy', '执行中');
  showRunbar('', planning ? '规划引擎 · 分步执行' : '流式执行');
  const body = { prompt, planning_enabled: planning };
  if(model) body.model = model;
  if(planning) return dispatchAsync(body);
  dispatchStream(body);
}

function dispatchAsync(body){
  fetch('/agent/run/async', {
    method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)
  }).then(r => r.json()).then(d => {
    currentRunId = d.run_id;
    showRunbar(d.run_id, '规划引擎 · 分步执行');
    renderRight({ num_turns: 0 });
    const poll = () => {
      if(!live || currentRunId !== d.run_id) return;
      fetch(`/agent/run/${d.run_id}/events`).then(r => r.json()).then(events => {
        for(const e of events){
          if(e.seq <= lastSeq) continue;
          lastSeq = e.seq;
          if(e.type === 'result'){ renderResult(e.data, false); finishRun(); return; }
          if(e.type === 'plan_update'){ renderPlan(e.data); continue; }
          if(e.type === 'error'){ appendError(typeof e.data === 'string' ? e.data : JSON.stringify(e.data)); continue; }
          handleEvent(e.type, e.data);
        }
        if(live) setTimeout(poll, 2000);
      }).catch(() => { if(live) setTimeout(poll, 4000); });
    };
    poll();
  }).catch(e => { appendError(e.message || String(e)); finishRun(); });
}

function dispatchStream(body){
  abortCtl = new AbortController();
  fetch('/agent/run/stream', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body), signal: abortCtl.signal
  }).then(resp => {
    if(!resp.ok || !(resp.headers.get('content-type') || '').includes('event-stream'))
      return resp.json().then(j => { throw new Error(j.message || ('HTTP ' + resp.status)); });
    const reader = resp.body.getReader(), dec = new TextDecoder();
    let buf = '';
    const pump = () => reader.read().then(({done, value}) => {
      if(done){ finishRun(); return; }
      buf += dec.decode(value, {stream:true});
      let i;
      while((i = buf.indexOf('\n\n')) >= 0){
        const frame = buf.slice(0, i); buf = buf.slice(i + 2);
        let ev = null, data = null;
        for(const line of frame.split('\n')){
          if(line.startsWith('event: ')) ev = line.slice(7).trim();
          else if(line.startsWith('data: ')){ try{ data = JSON.parse(line.slice(6)); }catch(e){} }
        }
        if(ev && data) handleEvent(ev, data);
      }
      return pump();
    });
    return pump();
  }).catch(e => {
    if(e.name === 'AbortError'){ appendError('已中断（客户端主动断开）'); finishRun(); return; }
    appendError(e.message || String(e)); finishRun();
  });
}

function abortRun(silent){
  if(abortCtl){ try{ abortCtl.abort(); }catch(e){} abortCtl = null; }
  if(currentRunId){
    fetch(`/agent/run/${encodeURIComponent(currentRunId)}`, { method:'DELETE' }).catch(() => {});
  }
  if(!silent){ appendError('已请求中断'); }
  finishRun();
}

function finishRun(){
  live = false; abortCtl = null;
  $('btn-dispatch').disabled = false; $('btn-dispatch').textContent = '派发 ▸';
  setConn('ok', '就绪');
  $('runbar-state').textContent = '已结束';
  setTimeout(hideRunbar, 1200);
  loadRuns();
}

/* ================= 事件渲染 ================= */
const TOOL_STYLE = [
  [/^Bash$/, 'shell', '⌨️'],
  [/Write|Edit|NotebookEdit/, 'edit', '📝'],
  [/Read|Glob|Grep/, 'read', '🔍'],
  [/Task|Agent/, 'agent', '🤖'],
  [/^mcp__/, 'mcp', '🔌'],
  [/WebFetch|WebSearch/, 'web', '🌐'],
  [/Skill/i, 'agent', '🧩'],
];
function toolMeta(name){
  for(const [re, cls, icon] of TOOL_STYLE) if(re.test(name)) return { cls, icon };
  return { cls: '', icon: '⚙️' };
}
function toolSummary(name, input){
  input = input || {};
  if(name === 'Bash') return input.command || '';
  if(/Write|Edit|NotebookEdit|Read/.test(name)) return input.file_path || '';
  if(/Task|Agent/.test(name)) return [input.subagent_type, (input.prompt || '').slice(0, 70)].filter(Boolean).join(' · ');
  if(/^mcp__/.test(name)) return name;
  return JSON.stringify(input).slice(0, 130);
}

function handleEvent(ev, data){
  const s = streamEl();
  if(ev === 'text_delta'){
    let last = s.lastElementChild;
    if(!last || !last.classList.contains('ev-text')){
      s.appendChild(el('<div class="ev ev-text"></div>')); last = s.lastElementChild;
    }
    last.textContent += (typeof data === 'string' ? data : (data.text || ''));
    scrollBottom(); return;
  }
  if(ev === 'thinking' || ev === 'thinking_delta'){
    const text = typeof data === 'string' ? data : (data && (data.thinking || data.text)) || '';
    if(!text) return;
    let last = s.lastElementChild;
    let box = (last && last.classList.contains('ev-think')) ? last : null;
    if(!box){
      box = el('<div class="ev ev-think"><div class="label"><span class="chev">▾</span>💭 思考过程<span class="cnt"></span></div><div class="tcontent"></div></div>');
      box.querySelector('.label').onclick = () => box.classList.toggle('collapsed');
      s.appendChild(box);
    }
    const body = box.querySelector('.tcontent');
    body.textContent += text;
    box.querySelector('.cnt').textContent = body.textContent.length + ' 字';
    scrollBottom(); return;
  }
  if(ev === 'tool_use'){
    const name = data.name, input = data.input || {};
    const { cls, icon } = toolMeta(name);
    const card = el(`<div class="ev ev-tool">
      <div class="thead">
        <span class="chip ${cls}">${icon}</span>
        <span class="tname">${esc(name)}</span>
        <span class="tsum">${esc(toolSummary(name, input))}</span>
        <span class="chev">▾</span>
      </div>
      <div class="tbody">
        <div class="sect"><div class="stitle">入参</div><pre>${esc(JSON.stringify(input, null, 2)).slice(0, 2600)}</pre></div>
        <div class="sect tresult" style="display:none"><div class="stitle">结果</div><pre></pre></div>
      </div></div>`);
    card.querySelector('.thead').onclick = () => card.classList.toggle('open');
    s.appendChild(card); scrollBottom(); return;
  }
  if(ev === 'tool_result'){
    const last = s.lastElementChild;
    if(last && last.classList.contains('ev-tool')){
      const content = (data && data.content !== undefined) ? data.content : data;
      const sect = last.querySelector('.tresult');
      const pre = sect.querySelector('pre');
      pre.textContent = typeof content === 'string' ? content.slice(0, 2200) : JSON.stringify(content).slice(0, 2200);
      if(data && data.is_error) pre.classList.add('err');
      sect.style.display = 'block';
    }
    return;
  }
  if(ev === 'plan_update'){ renderPlan(data); return; }
  if(ev === 'result'){ renderResult(data, false); return; }
  if(ev === 'error'){ appendError(typeof data === 'string' ? data : (data && data.message) || JSON.stringify(data)); return; }
  if(ev === 'budget_warning'){ appendError('⚠ 预算预警：' + JSON.stringify(data)); return; }
}

function renderPlan(plan){
  planSteps = plan;
  const s = streamEl();
  let box = s.querySelector('.ev-plan:last-of-type');
  if(!box){
    box = el(`<div class="ev ev-plan">
      <div class="ptop"><span class="ptitle">📋 执行计划</span><span class="pprog"></span></div>
      <div class="pbar"><i style="width:0%"></i></div>
      <div class="steps"></div></div>`);
    s.appendChild(box);
  }
  const steps = plan.steps || [];
  const done = steps.filter(x => x.status === 'done').length;
  box.querySelector('.pprog').textContent = `${done}/${steps.length}`;
  box.querySelector('.pbar i').style.width = (steps.length ? done / steps.length * 100 : 0) + '%';
  const icons = { pending: '', in_progress: '◐', done: '✓', failed: '✕' };
  const holder = box.querySelector('.steps'); holder.innerHTML = '';
  steps.forEach(st => {
    holder.appendChild(el(`<div class="pstep ${st.status}"><span class="ic">${icons[st.status] || ''}</span><span>${esc(st.action)}</span></div>`));
  });
  scrollBottom();
}

function renderResult(data, replay){
  const s = streamEl();
  const err = !!data.is_error;
  s.appendChild(el(`<div class="ev ev-result ${err ? 'err' : ''}">
    <div class="rhead">
      <span class="rtitle">${err ? '✕ 执行失败' : '✓ 执行完成'}</span>
      <div class="rpills">
        <span class="pill"><span class="k">turns</span><span class="v">${data.num_turns || 0}</span></span>
        <span class="pill"><span class="k">耗时</span><span class="v">${((data.duration_ms || 0) / 1000).toFixed(1)}s</span></span>
        <span class="pill"><span class="k">成本</span><span class="v">${data.cost_usd != null ? '$' + data.cost_usd.toFixed(4) : '—'}</span></span>
      </div>
    </div>
    <div class="rout">${esc(String(data.result || ''))}</div></div>`));
  scrollBottom();
  renderRight(data, replay);
}

function appendError(text){
  streamEl().appendChild(el(`<div class="ev ev-err"><span>⚠</span><span>${esc(text)}</span></div>`));
  scrollBottom();
}

/* ================= 右栏 ================= */
function renderRight(result, replay){
  const rb = $('rightbar');
  if(!result){
    rb.innerHTML = '<div class="empty"><div class="glyph">📊</div>运行开始后显示<br/>用量统计 · 产物预览 · trace</div>';
    return;
  }
  const u = result.usage || {};
  const tok = (u.input_tokens || 0) + (u.output_tokens || 0) + (u.cache_read_input_tokens || 0) + (u.cache_creation_input_tokens || 0);
  const cached = u.cache_read_input_tokens || 0;
  let html = `<div class="sec"><h3>用量统计</h3><div class="statgrid">
    <div class="cell"><div class="v">${tok.toLocaleString()}</div><div class="k">tokens</div></div>
    <div class="cell"><div class="v">${result.num_turns == null ? '—' : result.num_turns}</div><div class="k">turns</div></div>
    <div class="cell hl"><div class="v sm">${result.cost_usd != null ? '$' + result.cost_usd.toFixed(4) : '—'}</div><div class="k">成本</div></div>
    <div class="cell hl"><div class="v sm">${((result.duration_ms || 0) / 1000).toFixed(1)}s</div><div class="k">耗时</div></div>
    <div class="cell" style="grid-column:span 2"><div class="v sm">${cached.toLocaleString()}</div><div class="k">缓存命中 tokens</div></div>
  </div></div>`;
  if(currentRunId){
    html += `<div class="sec"><h3>产物预览</h3><div class="artbox">
      <button class="btn-art" onclick="previewArtifact('index.html')">📄 index.html</button>
      <button class="btn-art" onclick="previewArtifact('demo.html')">📄 demo.html</button>
      <button class="btn-art" onclick="previewArtifact('README.md')">📝 README.md</button>
      <iframe id="preview" class="preview-frame"></iframe>
    </div></div>`;
  }
  html += `<div class="sec"><h3>Trace</h3><div class="tracebox" id="trace-box">加载中…</div></div>`;
  rb.innerHTML = html;
  if(currentRunId) fetch(`/agent/trace/${encodeURIComponent(currentRunId)}`)
    .then(r => r.json())
    .then(tr => {
      const box = $('trace-box'); if(!box) return;
      if(tr.trace){ box.textContent = JSON.stringify(tr.trace, null, 1).slice(0, 3000); }
      else { box.textContent = JSON.stringify(tr, null, 1).slice(0, 1200); }
    })
    .catch(() => { const b = $('trace-box'); if(b) b.textContent = '（trace 不可用）'; });
}
function previewArtifact(path){
  if(!currentRunId) return;
  const f = $('preview'); if(!f) return;
  f.style.display = 'block';
  f.src = `/agent/artifact/${encodeURIComponent(currentRunId)}?path=${encodeURIComponent(path)}`;
}

/* ================= 运行历史 ================= */
function loadRuns(){
  fetch('/agent/runs').then(r => r.json()).then(d => {
    const list = $('runlist'), runs = d.runs || [];
    $('sidebar-foot').textContent = runs.length ? `共 ${runs.length} 条运行记录` : '—';
    list.innerHTML = '';
    if(!runs.length){
      list.innerHTML = '<div class="empty"><div class="glyph">🗂️</div>暂无运行记录</div>';
      return;
    }
    runs.forEach(r => {
      const item = el(`<div class="runitem" data-rid="${esc(r.run_id)}">
        <div class="id"><span class="badge st-${esc(r.status)}">${esc(r.status)}</span></div>
        <div class="meta"><span class="pv">${esc((r.prompt || '').slice(0, 30) || '(无 prompt)')}</span></div>
      </div>`);
      item.onclick = () => replayRun(r.run_id);
      list.appendChild(item);
    });
    if(currentRunId) markActive(currentRunId);
  }).catch(() => { $('runlist').innerHTML = '<div class="empty"><div class="glyph">⚠️</div>历史加载失败</div>'; });
}
function markActive(rid){
  document.querySelectorAll('.runitem').forEach(n => n.classList.toggle('active', n.dataset.rid === rid));
}
function replayRun(runId){
  abortRun(true);
  live = false; currentRunId = runId; lastSeq = 0; planSteps = null;
  markActive(runId);
  showRunbar(runId, '回放模式');
  streamEl().innerHTML = '<div class="replay-badge">⏮ 回放模式 · 按事件序列重放</div>';
  renderRight({ num_turns: 0 });
  fetch(`/agent/run/${encodeURIComponent(runId)}/events`).then(r => r.json()).then(events => {
    for(const e of events){
      if(e.type === 'plan_update'){ renderPlan(e.data); continue; }
      if(e.type === 'result'){ renderResult(e.data, true); continue; }
      handleEvent(e.type, e.data);
    }
    $('runbar-state').textContent = '回放完成 · ' + events.length + ' 事件';
    scrollBottom();
  }).catch(e => appendError('回放加载失败: ' + e.message));
}

/* ================= 初始化 ================= */
$('prompt').addEventListener('keydown', e => {
  if((e.ctrlKey || e.metaKey) && e.key === 'Enter') dispatch();
});
loadRuns();
fetch('/health').then(r => r.json())
  .then(() => setConn('ok', '就绪'))
  .catch(() => setConn('off', '服务离线'));
</script>
</body>
</html>
