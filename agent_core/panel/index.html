/* ================= 内嵌终端（WebSocket 直连，持久 cwd 会话） ================= */
let termWS = null, termBusy = false, termHistory = [], termHistIdx = 0;
let termX = null;  // xterm 实例（CDN 加载成功后启用；失败降级 DOM 输出）
let termXLoading = null;
const TERM_HIST_KEY = 'agent_panel_term_history';
const termAssets = new Map();

function loadTerminalAsset(src, stylesheet = false) {
  if (termAssets.has(src)) return termAssets.get(src);
  const pending = new Promise((resolve, reject) => {
    const el = document.createElement(stylesheet ? 'link' : 'script');
    if(stylesheet){ el.rel = 'stylesheet'; el.href = src; }
    else { el.src = src; }
    const timer = setTimeout(() => finish(new Error('timeout ' + src)), 5000);
    function finish(error){
      clearTimeout(timer);
      el.onload = el.onerror = null;
      if(error){ el.remove(); reject(error); } else resolve();
    }
    el.onload = () => finish();
    el.onerror = () => finish(new Error('load ' + src));
    document.head.appendChild(el);
  });
  termAssets.set(src, pending);
  return pending;
}

async function ensureXterm(){
  if (termX) return true;
  if (window.__xtermFailed) return false;
  if (termXLoading) return termXLoading;
  termXLoading = (async () => {
  let candidate = null;
  try{
    await Promise.all([
      loadTerminalAsset('https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css', true),
      loadTerminalAsset('https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js'),
      loadTerminalAsset('https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js'),
    ]);
    if (!window.Terminal) throw new Error('no Terminal');
    candidate = new window.Terminal({
      convertEol: true, fontSize: 12.5,
      fontFamily: "'JetBrains Mono','Cascadia Code',monospace",
      theme: { background: '#080a0f', foreground: '#c9d4e3',
               cursor: '#3ddc84', selectionBackground: 'rgba(61,220,132,.28)',
               black: '#0d1017', brightBlack: '#71809a' },
      scrollback: 5000, disableStdin: true,
    });
    const fit = new window.FitAddon.FitAddon();
    candidate.loadAddon(fit);
    $('term-view').classList.add('xterm-on');
    candidate.open($('term-xterm'));
    const fitVisible = () => {
      if($('term-xterm').clientWidth && $('term-xterm').clientHeight){
        try{ fit.fit(); }catch(e){}
      }
    };
    fitVisible();
    new ResizeObserver(fitVisible).observe($('term-xterm'));
    termX = candidate;
    // WS 可能先于资源就绪：迁移已有输出，避免切换渲染器后丢失连接信息和命令结果。
    for(const span of $('term-out').children) termWrite(span.textContent, span.className);
    $('term-out').innerHTML = '';
    return true;
  }catch(e){
    if(candidate){ try{ candidate.dispose(); }catch(_){} }
    termX = null;
    window.__xtermFailed = true;
    $('term-view').classList.remove('xterm-on');
    $('term-xterm').classList.add('fallback');
    termPrint('[xterm 不可用，降级纯文本输出]\n', 'info');
    return false;
  }
  })();
  return termXLoading;
}
function termWrite(text, cls){
  if (termX){
    const color = cls === 'cmd' ? '\x1b[1;32m' : cls === 'err' ? '\x1b[31m'
                : cls === 'info' ? '\x1b[90m' : '';
    termX.write(color + text + (color ? '\x1b[0m' : ''));
  } else {
    termPrint(text, cls);
  }
}

function updateTabIndicator(){
  const container = $('viewtabs');
  const ind = $('vt-indicator');
  if(!container || !ind) return;
  const activeBtn = container.querySelector('.vt.active');
  if(activeBtn){
    ind.style.left = activeBtn.offsetLeft + 'px';
    ind.style.width = activeBtn.offsetWidth + 'px';
    ind.style.opacity = '1';

  }

function switchView(v){
  const isTerm = v === 'terminal';
  const streamEl = $('stream');
  const compEl = $('composer');
  const termEl = $('term-view');
  if(streamEl) streamEl.style.display = isTerm ? 'none' : '';
  if(compEl) compEl.style.display = isTerm ? 'none' : '';
  if(termEl){
    termEl.classList.toggle('show', isTerm);
    termEl.classList.toggle('xterm-on', isTerm && !!termX);
  }
  const vtStream = $('vt-stream');
  const vtTerm = $('vt-terminal');
  if(vtStream) vtStream.classList.toggle('active', !isTerm);
  if(vtTerm) vtTerm.classList.toggle('active', isTerm);

  const activeView = isTerm ? termEl : streamEl;
  if(activeView){
    activeView.classList.remove('animate-view-switch');
    void activeView.offsetWidth;
    activeView.classList.add('animate-view-switch');
  }

  updateTabIndicator();

  if(isTerm){
    termConnect();
    const inp = $('term-in');
    if(inp) inp.focus();
    ensureXterm();
  }
}

function termConnect(){
  if(termWS && termWS.readyState <= 1) return;
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  let key = '';
  try{ key = localStorage.getItem('orch_api_key') || ''; }catch(e){}
  const url = proto + '//' + location.host + '/agent/terminal' +
              (key ? '?api_key=' + encodeURIComponent(key) : '');
  try{ termWS = new WebSocket(url); }catch(e){ termPrint('[无法建立连接: ' + e.message + ']\n', 'err'); return; }
  termWS.onopen = () => termPrint('[已连接 · 输入命令直接执行]\n', 'info');
  termWS.onmessage = ev => {
    let m; try{ m = JSON.parse(ev.data); }catch(e){ return; }
    if(m.type === 'ready'){
      $('term-cwd').textContent = m.cwd;
      if(m.workspace) setWsChip(m.workspace);
      termPrint('[shell: ' + m.shell + ' · 工作区: ' + (m.workspace || '—') + ']\n', 'info');
    } else if(m.type === 'output'){
      termPrint(m.data, m.cls);
    } else if(m.type === 'error'){
      termPrint(m.message + '\n', 'err');
    } else if(m.type === 'confirm'){
      termConfirm(m);
    } else if(m.type === 'done'){
      termBusy = false;
      if(m.cwd) $('term-cwd').textContent = m.cwd;
      if(m.code) termPrint('[退出码 ' + m.code + ']\n', 'info');
    }
  };
  termWS.onclose = () => { termPrint('[连接已断开 · 重新切到终端标签可重连]\n', 'info'); termWS = null; termBusy = false; };
  termWS.onerror = () => termPrint('[连接错误]\n', 'err');
}

function termPrint(text, cls){
  if (termX){ termWrite(text, cls); return; }
  const out = $('term-out');
  const span = document.createElement('span');
  if(cls) span.className = cls;
  span.textContent = text;
  out.appendChild(span);
  out.scrollTop = out.scrollHeight;
}
function termClear(){
  $('term-out').innerHTML = '';
  if (termX) termX.reset();
}

function termRun(){
  const inp = $('term-in');
  const cmd = inp.value.trim();
  if(!cmd) return;
  if(!termWS || termWS.readyState !== 1){
    termPrint('[未连接，正在重连…]\n', 'err'); termConnect(); return;
  }
  if(termBusy){ termPrint('[有命令正在执行，Ctrl+C 可中断]\n', 'err'); return; }
  termSend(cmd, false, false);
  if(termHistory[termHistory.length - 1] !== cmd){
    termHistory.push(cmd);
    if(termHistory.length > 200) termHistory.shift();
    try{ localStorage.setItem(TERM_HIST_KEY, JSON.stringify(termHistory)); }catch(e){}
  }
  termHistIdx = termHistory.length;
  inp.value = '';
}
function termSend(cmd, allowOnce, allowSession){
  if(!termWS || termWS.readyState !== 1){ termPrint('[未连接]\n', 'err'); return; }
  const tag = allowSession ? '   [已授权本次会话]' : (allowOnce ? '   [已授权一次]' : '');
  termPrint('$ ' + cmd + tag + '\n', 'cmd');
  const payload = { type: 'run', cmd };
  if(allowOnce) payload.allow_once = true;
  if(allowSession) payload.allow_session = true;
  termWS.send(JSON.stringify(payload));
  termBusy = true;
}
function termConfirm(m){
  showModal({
    title: '⚠ 工作区外访问授权',
    bodyHTML:
      '<div class="modal-hint">' + esc(m.message || '该操作越出工作区') + '</div>' +
      '<div class="modal-kv"><span>工作区</span><code>' + esc(m.workspace || '—') + '</code></div>' +
      '<div class="modal-kv"><span>目标</span><code>' + esc((m.paths || []).join('\n')) + '</code></div>' +
      '<div class="modal-kv"><span>命令</span><code>' + esc(m.cmd || '') + '</code></div>',
    buttons: [
      { label: '拒绝' },
      { label: '允许一次', onClick: () => termSend(m.cmd, true, false) },
      { label: '本次会话允许', cls: 'btn-primary', onClick: () => termSend(m.cmd, true, true) }
    ]
  });
}
function termInterrupt(){
  if(termWS && termWS.readyState === 1) termWS.send(JSON.stringify({ type:'interrupt' }));
}
$('term-in').addEventListener('keydown', e => {
  if(e.key === 'Enter'){ e.preventDefault(); termRun(); return; }
  if(e.key === 'ArrowUp'){
    e.preventDefault();
    if(termHistIdx > 0){ termHistIdx--; $('term-in').value = termHistory[termHistIdx] || ''; }
    return;
  }
  if(e.key === 'ArrowDown'){
    e.preventDefault();
    if(termHistIdx < termHistory.length - 1){ termHistIdx++; $('term-in').value = termHistory[termHistIdx] || ''; }
    else { termHistIdx = termHistory.length; $('term-in').value = ''; }
    return;
  }
  if(e.ctrlKey && (e.key === 'c' || e.key === 'C')){ e.preventDefault(); termInterrupt(); return; }
  if(e.ctrlKey && (e.key === 'l' || e.key === 'L')){ e.preventDefault(); termClear(); }
});
try{
  termHistory = JSON.parse(localStorage.getItem(TERM_HIST_KEY) || '[]');
  termHistIdx = termHistory.length;
}catch(e){ termHistory = []; }

function initMintParticles(){
  const canvas = $('mint-particle-canvas');
  if(!canvas || !canvas.getContext) return;
  const ctx = canvas.getContext('2d');
  if(!ctx) return;
  if(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

  let width = 0, height = 0, animId = null;
  const count = 30;
  const particles = [];

  function resize(){
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  for(let i = 0; i < count; i++){
    particles.push({
      x: Math.random() * (width || 800),
      y: Math.random() * (height || 600),
      radius: Math.random() * 2 + 1,
      vx: (Math.random() - 0.5) * 0.4,
      vy: (Math.random() - 0.5) * 0.4,
      baseAlpha: Math.random() * 0.22 + 0.1
    });
  }

  function frame(){
    ctx.clearRect(0, 0, width, height);

    for(let i = 0; i < count; i++){
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      if(p.x < -10) p.x = width + 10;
      else if(p.x > width + 10) p.x = -10;
      if(p.y < -10) p.y = height + 10;
      else if(p.y > height + 10) p.y = -10;

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(16, 185, 129, ' + p.baseAlpha + ')';
      ctx.fill();

      for(let j = i + 1; j < count; j++){
        const p2 = particles[j];
        const dx = p.x - p2.x;
        const dy = p.y - p2.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        if(dist < 110){
          ctx.beginPath();
          ctx.moveTo(p.x, p.y);
          ctx.lineTo(p2.x, p2.y);
          ctx.strokeStyle = 'rgba(16, 185, 129, ' + ((1 - dist / 110) * 0.08) + ')';
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }
    }
    animId = requestAnimationFrame(frame);
  }

  animId = requestAnimationFrame(frame);

  function syncMintAnimation(){
    if(document.hidden || document.documentElement.dataset.agentStandby === 'true'){
      if(animId) cancelAnimationFrame(animId);
      animId = null;
    } else if(!animId){
      animId = requestAnimationFrame(frame);
    }
  }
  document.addEventListener('visibilitychange', syncMintAnimation);
  document.addEventListener('m-agent:standby', syncMintAnimation);
  syncMintAnimation();
}
try { initMintParticles(); } catch(e){}
